# generated by archgen GENERATE (LARGE) — demo platform
# status left unset: the resolver derives readiness (SKILL.md GENERATE step 3)
tasks:
  # Foundation — everything depends on the scaffold
  - id: SCAFFOLD
    title: Scaffold project skeleton and typed config loading
    depends_on: []
    file_ownership: ["src/config/**", "package.json"]
    acceptance:
      - "npm run build exits 0"
      - "config loads from env with a typed schema"
  # Shared kernel — no feature imports allowed here
  - id: SHARED
    title: Implement shared logging and error envelope helpers
    depends_on: [SCAFFOLD]
    file_ownership: ["src/shared/**"]
    acceptance:
      - "logger emits structured json lines"
      - "error envelope helper covers every handler path"
  # Feature modules run in parallel — disjoint file_ownership
  - id: API
    title: Notes REST API with validation
    depends_on: [SCAFFOLD, SHARED]
    file_ownership: ["src/features/api/**"]
    acceptance:
      - "GET /notes returns the seeded list"
      - "POST /notes rejects an empty body with 400"
  - id: WEB
    title: Admin console pages wired to the API client
    depends_on: [SCAFFOLD, SHARED]
    parallel_group: wave-ui
    file_ownership: ["src/features/web/**"]
    acceptance:
      - "console renders the notes list from the live API"
  # Docs track runs alongside the features
  - id: DOCS
    title: Author user guide and record architecture decisions
    depends_on: [SCAFFOLD]
    artifacts: ["docs/user-guide.md", "decisions/0001-postgres-over-mongo.md"]
    file_ownership: ["docs/user-guide.md"]
    acceptance:
      - "user guide covers install and first-run"
      - "decision records follow the ADR template"
  # Verification gate — final wave
  - id: VERIFY
    title: End-to-end smoke suite across api and web
    depends_on: [API, WEB]
    file_ownership: ["tests/e2e/**"]
    acceptance:
      - "smoke suite completes the happy path against a seeded store"
      - "suite exits 0 in ci mode"
