# Pre-seeded interview answers — packages/mcp/assets/references/interview.md answers-file format.
# The GENERATE driver treats this as authoritative user input and skips the
# conversational rounds (non-interactive E2E).
scope_class: LARGE
problem: Teams cannot ship a multi-module service without architecture decisions scattered across chat threads
success_criteria:
  - architecture and task graph exist before any code is written
  - every task carries objective acceptance criteria and disjoint file ownership
constraints:
  - git is the only version-control requirement
  - tooling scripts must stay zero-dependency
stack:
  language: typescript
  runtime: node20
  framework: fastify
  database: postgres
integrations: [stripe, sendgrid]
compliance: []             # checklist placeholders only
risks:
  - scope creep beyond the initial module boundaries
plan_profile:
  confidence: high
  signals: [new-module, multi-module, public-contract, data-migration, irreversible]
  artifacts:
    - path: .archgen/demo/tasks.yaml
      decision: create
      reason: executable dependency and ownership contract
    - path: .archgen/demo/answers.yaml
      decision: create
      reason: canonical elicited requirements and profile
    - path: .archgen/demo/architecture.yaml
      decision: create
      reason: multi-module structural contract
    - path: .archgen/demo/plans/demo-platform.md
      decision: create
      reason: LARGE implementation and review narrative
    - path: .archgen/demo/docs/c4-context.md
      decision: create
      reason: cross-module topology needs an explanatory view
    - path: .archgen/demo/decisions/0001-postgres-over-mongo.md
      decision: create
      reason: irreversible datastore choice
  escalate_if: [regulated, irreversible]
