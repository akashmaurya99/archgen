# schema_version: 1
# generator: archgen
# generated_at: 2026-08-26T09:00:00.000Z
name: Acme Shop
slug: acme-shop # maps to .archgen/acme-shop/
stack:
  language: typescript
  runtime: node20
  framework: nextjs
  database: postgres
structure: # planned folder tree defined BEFORE coding
  - path: src/features/<feature>/
    purpose: feature modules (api, internal)
  - path: src/shared/
    purpose: cross-feature utilities; MUST NOT import from features/
  - path: src/config/
    purpose: typed env parsing + constants
  - path: tests/unit/features/<feature>/
    purpose: unit tests — the test tree, a SIBLING of src/ that mirrors the source path
naming_conventions: # referenced by every task step and file_ownership entry
  file_naming: kebab-case files; feature folder matches module name
  dir_layout: "<module>/{api,internal}; shared utilities in src/shared/ only; tests mirror the source path under tests/unit/"
  symbol_casing: PascalCase types, camelCase functions, SCREAMING_SNAKE env vars
  test_placement: tests/unit/<path under the source root>/<the language's test file> — the test tree is a SIBLING of the source tree, never inside it
modules: # one entry per module; repeat per module
  - name: catalog
    responsibility: product browsing + search
    owns: ["src/features/catalog/**"]
    depends_on_modules: [] # DAG; drives task depends_on edges
    key_interfaces: # ONLY exports other modules may import
      - CatalogApi (src/features/catalog/api/index.ts)
data_contracts: # one block per entity; repeat per entity
  order:
    storage: postgres table orders (migrations/NNNN_orders.sql)
    fields:
      - { field: id, type: uuid, required: true, notes: pk }
      - { field: total_cents, type: integer, required: true, notes: ">= 0" }
      - { field: status, type: "enum(pending,paid,failed)", required: true }
api_contracts: # one block per operation; repeat per operation
  payments:
    - endpoint: /api/checkout/pay
      method: POST
      auth: session cookie; 401 when absent
      request_payload: { order_id: uuid }
      success: "200 {payment_id: uuid, status: paid}"
      error_shape: { code: string, message: string, retryable: boolean }
environment_matrix: # unparsed vars fail fast at startup in src/config/
  - { var: DATABASE_URL, dev: local docker postgres, ci: ephemeral service, prod: secret ref, required: true }
decisions: # summary index; full records live in decisions/NNNN-title.md
  - id: D1
    title: Postgres over MongoDB
    context: ACID order transactions + relational reporting
    decision: Postgres 16 with Prisma
    consequences: schema migrations required per release
