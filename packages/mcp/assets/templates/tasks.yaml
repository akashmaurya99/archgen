tasks:
  - id: "TASK-01"
    title: "<shared foundation>"
    depends_on: []
    file_ownership: ["<source-root>/<shared>/**", "<test-root>/<shared>/**"]
    acceptance:
      - "<build command> exits 0"
      - "<typed config or shared contract> produces <expected result>"

  - id: "TASK-02"
    title: "<feature module A>"
    depends_on: ["TASK-01"]
    parallel_group: "wave-2"
    file_ownership: ["<source-root>/<module-a>/**", "<test-root>/<module-a>/**"]
    acceptance:
      - "<API/CLI behavior A> returns <observable result> (covers FR-<MODULE>-01)"

  - id: "TASK-03"
    title: "<feature module B>"
    depends_on: ["TASK-01"]
    parallel_group: "wave-2"
    file_ownership: ["<source-root>/<module-b>/**", "<test-root>/<module-b>/**"]
    acceptance:
      - "<API/CLI behavior B> returns <observable result> (covers E1)"

  - id: "TASK-04"
    title: "<integration and failure recovery>"
    depends_on: ["TASK-02", "TASK-03"]
    parallel_group: "wave-3"
    file_ownership:
      - "<source-root>/<integration>/**"
      - "<test-root>/integration/<feature>/**"
      - "docs/<feature>-verification.md"
    artifacts: ["docs/<feature>-verification.md"]
    acceptance:
      - "duplicate submission performs the operation once (covers E1)"
      - "<dependency> 5xx retries <n> times, then returns <structured error> (covers E2)"
      - "<invalid input> returns <error shape> matching architecture.yaml api_contracts.<module>.error_shape (covers FR-<MODULE>-02)"
      - "<locale/format case> produces <expected representation> (covers E3)"
