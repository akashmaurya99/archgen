# comment lines are preserved by archgen_tasks{set_status}
tasks:
  # Wave 1 — foundation
  - id: TASK-01
    title: <outcome this task delivers>
    depends_on: []
    file_ownership: ["<source-root>/<module>/**", "<test-root>/unit/<module>/**"] # repo-root-relative, disjoint per wave
    acceptance:
      - "<build command> exits 0"
      - "<observable behavior check> produces <expected output>"

  # Wave 2 — feature
  - id: TASK-02
    title: <feature behavior>
    depends_on: [TASK-01]
    file_ownership: ["<source-root>/<feature>/**", "<test-root>/unit/<feature>/**"]
    acceptance:
      - "<test command> passes with <sample size or threshold>"
      - "<API/CLI behavior> returns <observable result>"

  # Final integration
  - id: TASK-03
    title: <integration outcome>
    depends_on: [TASK-02]
    parallel_group: wave-final
    file_ownership: ["<source-root>/<feature>/**", "<test-root>/integration/<feature>/**", "docs/<feature>.md"]
    artifacts: ["docs/<feature>.md"] # must be a subset of file_ownership
    acceptance:
      - "<integration command> completes <journey> against <test double or environment>"

  # LARGE-scope task example (cites edge-row IDs; PRD FR-* IDs when a PRD exists)
  - id: TASK-04
    title: <failure-sensitive operation with retry>
    depends_on: [TASK-03]
    parallel_group: wave-final
    file_ownership:
      - <source-root>/<feature>/<implementation file>            # per naming_conventions.dir_layout
      - <test-root>/unit/<feature>/<mirrored test file>          # the mirrored test tree
      - docs/<feature>-recovery.md
    artifacts: ["docs/<feature>-recovery.md"]
    acceptance:
      - "duplicate submission performs the operation once (E1)"
      - "<dependency> 5xx retries <n> times, then returns <structured error> (E2)"
      - "<invalid input> returns <error shape> matching ../architecture.yaml api_contracts.<module>.error_shape (FR-<MODULE>-02)"
      - "<locale/format case> produces <expected representation> (E3)"
