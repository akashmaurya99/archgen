name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The MCP server is the runtime that owns every deterministic capability
  # (the skill ships no code). Node >= 20 is the SDK v2 floor.
  mcp:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
        working-directory: packages/mcp
      - run: npm test
        working-directory: packages/mcp

  cli:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # The CLI is zero-dependency, but its migration suite drives the real
      # archgen MCP server (packages/mcp/bin/archgen-mcp.mjs) — which needs
      # the MCP SDK. The CLI therefore needs the server's dependencies too.
      - run: npm ci --no-audit --no-fund
        working-directory: packages/mcp
      - run: npm --prefix packages/cli test

  # Extension toolchain (jsdom + better-sqlite3 + vitest pools) is only
  # stable on Node >= 22; the shipped extension runs inside VS Code's
  # Electron runtime, so CI node here is test tooling, not product compat.
  # README mandates Node 22 for the native-addon pool — pinned, NOT matrixed.
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: packages/extension
      - run: npm run typecheck
        working-directory: packages/extension
      - run: npm run compile
        working-directory: packages/extension
      - run: npm test
        working-directory: packages/extension
      # Packaging smoke: vsce must produce a vsix from the esbuild bundles
      # + the .vscodeignore-whitelisted better-sqlite3 runtime chain. The
      # vsix is a build artifact — uploaded here, NEVER committed (see
      # .gitignore *.vsix).
      - run: npm run package
        working-directory: packages/extension
      - run: ls archgen-extension-*.vsix
        working-directory: packages/extension
      - uses: actions/upload-artifact@v4
        with:
          name: archgen-extension-vsix
          path: packages/extension/*.vsix
          if-no-files-found: error

  # Coverage HARD GATE: vitest.config.mts thresholds fail the run if any
  # metric (lines/branches/functions/statements) drops below 90%.
  # Node 22 only — same native-addon constraint as the extension job.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: packages/extension
      - run: npm run coverage
        working-directory: packages/extension

  # End-to-end fixture suites: the greenfield / brownfield / verifier-negative
  # flows now drive the REAL archgen MCP tool surface, not the old scripts.
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        working-directory: packages/mcp
      - run: bash fixtures/greenfield-demo/run.sh
      - run: bash fixtures/brownfield-demo/run.sh
      - run: bash fixtures/verifier-negative/run.sh

  # Context-budget gate: the ALWAYS-ON cost (SKILL.md + the MCP tool catalog
  # injected into every request) must not regress. Measured 12,672 tokens; the
  # ceiling leaves ~7% headroom. The ON-DEMAND cost is the other half of the
  # story: the reference documents moved into the package, so the shipped skill
  # tree dropped from 25,793 to 9,190 tokens and a section load is ~1-2 KB
  # instead of an 11 KB document.
  context-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        working-directory: packages/mcp
      - run: node internal/tools/context-budget.mjs --skill-dir skill --project . --max-always-on 13600

  # Capability contract: the skill declares the MCP server version it needs,
  # and that requirement must be satisfiable by THIS release.
  capability-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node internal/tools/check-capability-contract.mjs

  # Repo immutability: the suites must never mutate the repository (a suite
  # that silently deletes a tracked file looks like a green run).
  immutable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        working-directory: packages/extension
      - run: npm ci --no-audit --no-fund
        working-directory: packages/mcp
      - run: node internal/tools/repo-immutable.mjs -- npm test

  # Model↔view parity: the extension's own parser must read the
  # greenfield-demo fixture into exactly the view model the DAG renders.
  cross-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: packages/extension
      - run: npm run cross-mode
        working-directory: packages/extension

  # Version single-source + vendor-freshness gate: every derived version
  # field (skill config, SKILL.md frontmatter, cli + extension package.json)
  # and vendored copy must already match archgen.config.json. sync:check
  # fails with an explicit drift report; sync + git diff catches any
  # derived file someone shipped without running `npm --prefix packages/cli run sync`.
  vendor-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix packages/cli run sync:check
      - run: npm --prefix packages/cli run sync
      - run: git diff --exit-code -- skill/archgen.config.json skill/SKILL.md packages/cli/vendor/skills/archgen packages/cli/package.json packages/extension/package.json packages/mcp/package.json
      # Never commit a CodeGraph index (local machine state). The extension's
      # test fixtures are the ONE exception: they are synthetic SQLite inputs
      # the suite reads, regenerated by `npm run build:fixture-db`.
      - run: |
          tracked="$(git ls-files | grep -E '(^|/)\.codegraph/' | grep -v '/test/fixtures/' || true)"
          if [ -n "$tracked" ]; then
            echo '::error:: .codegraph/ must never be tracked (outside test/fixtures/):'
            echo "$tracked"
            exit 1
          fi

  # Supply-chain gate: fail on high+ severity advisories.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Extension has a committed lockfile — audit it directly.
      - run: npm audit --audit-level=high
        working-directory: packages/extension
      # CLI is zero-dep with no lockfile; generate one in the CI workspace
      # (never committed) so npm audit can resolve the tree.
      - run: npm install --package-lock-only --no-audit --no-fund
        working-directory: packages/cli
      - run: npm audit --audit-level=high
        working-directory: packages/cli
      # The MCP server depends on the official MCP SDK + Zod.
      - run: npm audit --audit-level=high
        working-directory: packages/mcp

  # Supply-chain gate: gitleaks scans full history and fails on any secret.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
