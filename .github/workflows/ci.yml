name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The MCP server is the runtime that owns every deterministic capability
  # (the skill ships no code). Node >= 20 is the SDK v2 floor.
  mcp:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
        working-directory: packages/mcp
      - run: npm test
        working-directory: packages/mcp

  cli:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # The CLI is zero-dependency, but its migration suite drives the real
      # archgen MCP server (packages/mcp/bin/archgen-mcp.mjs) — which needs
      # the MCP SDK. The CLI therefore needs the server's dependencies too.
      - run: npm ci --no-audit --no-fund
        working-directory: packages/mcp
      - run: npm --prefix packages/cli test

  # Coverage gate for the MCP server — the runtime that owns every
  # deterministic capability. The floors below are a REGRESSION GUARD: each
  # one is set just under the measured coverage at the time of writing, so
  # the job fails when a change costs coverage and passes when it does not.
  # Node 22 only — the threshold flags (--test-coverage-*) need a modern
  # runtime, and the job is a measurement, not a compatibility matrix.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: packages/mcp
      - run: npm test
        working-directory: packages/mcp
      # The report is written to a FILE (not stdout) so it can be uploaded as
      # a diagnosable artifact. The destination directory must exist first —
      # node does not create it.
      - name: Measure coverage against the floors
        working-directory: packages/mcp
        run: |
          mkdir -p coverage
          node --test \
            --experimental-test-coverage \
            --test-reporter=lcov \
            --test-reporter-destination=coverage/lcov.info \
            --test-coverage-lines=85 \
            --test-coverage-functions=80 \
            --test-coverage-branches=70
      # The coverage report is the DIAGNOSIS for a threshold failure: the
      # step's own log is enough to see "84.1% < 85%", but not enough to see
      # WHICH file fell below. Upload it so a failure is readable without
      # re-running the job locally.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-coverage
          path: packages/mcp/coverage
          if-no-files-found: ignore
          retention-days: 7

  # End-to-end fixture suites: the greenfield / brownfield / verifier-negative
  # flows drive the REAL archgen MCP tool surface, not the old scripts, and
  # the tool-matrix drives EVERY action of EVERY tool through the real binary.
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        working-directory: packages/mcp
      - run: bash fixtures/greenfield-demo/run.sh
      - run: bash fixtures/brownfield-demo/run.sh
      - run: bash fixtures/verifier-negative/run.sh
      - run: bash fixtures/tool-matrix/run.sh

  # Context-budget gate: the ALWAYS-ON cost (SKILL.md + the MCP tool catalog
  # injected into every request) must not regress. Measured 10,947 tokens; the
  # ceiling leaves ~5% headroom. The ON-DEMAND cost is the other half of the
  # story: the reference documents moved into the package, so the shipped skill
  # tree dropped to 7,851 tokens and a section load is ~1-2 KB instead of an
  # 11 KB document.
  context-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        working-directory: packages/mcp
      - run: node internal/tools/context-budget.mjs --skill-dir skill --project . --max-always-on 11500

  # Capability contract: the skill declares the MCP server version it needs,
  # and that requirement must be satisfiable by THIS release.
  capability-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node internal/tools/check-capability-contract.mjs
      # The contract EXAMPLE must stay version-agnostic, so no release ever
      # has to go and update a comment. The real declaration keeps a concrete
      # version and is checked by the step above.
      - run: node internal/tools/version-lint.mjs

  # Repo immutability: the suites must never mutate the repository (a suite
  # that silently deletes a tracked file looks like a green run).
  immutable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        working-directory: packages/mcp
      - run: node internal/tools/repo-immutable.mjs -- npm test

  # Version single-source + vendor-freshness gate: every derived version
  # field (skill config, SKILL.md frontmatter, cli + mcp package.json)
  # and vendored copy must already match archgen.config.json. sync:check
  # fails with an explicit drift report; sync + git diff catches any
  # derived file someone shipped without running `npm --prefix packages/cli run sync`.
  vendor-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix packages/cli run sync:check
      - run: npm --prefix packages/cli run sync
      - run: git diff --exit-code -- skill/archgen.config.json skill/SKILL.md packages/cli/vendor/skills/archgen packages/cli/package.json packages/mcp/package.json
      # The umbrella check: every version surface — derived, hand-edited and
      # lockfile — must agree with archgen.config.json. It reports them all
      # together, each with the command that fixes it.
      - run: node internal/tools/version-consistency.mjs
      # A lockfile whose version disagrees with its package.json makes
      # `npm ci` REFUSE to install ("can only install packages when your
      # package.json and package-lock.json are in sync"). That is a release
      # that fails on the runner, not on the maintainer's machine. The
      # committed lockfile is therefore version-checked here.
      - name: The committed lockfile matches its package.json
        run: |
          set -euo pipefail
          dir=packages/mcp
          pkg_version="$(node -p "require('./$dir/package.json').version")"
          lock_version="$(node -p "require('./$dir/package-lock.json').version")"
          lock_root="$(node -p "require('./$dir/package-lock.json').packages[''].version")"
          echo "$dir: package.json=$pkg_version lock=$lock_version lock_root=$lock_root"
          if [ "$pkg_version" != "$lock_version" ] || [ "$pkg_version" != "$lock_root" ]; then
            echo "::error::$dir lockfile version does not match package.json ($pkg_version vs $lock_version/$lock_root)"
            echo "::error::Fix: npm --prefix $dir install --package-lock-only --no-audit --no-fund"
            exit 1
          fi
      # Never commit a CodeGraph index — it is local machine state, and the
      # one consumer of it (the MCP server) builds its own.
      - run: |
          tracked="$(git ls-files | grep -E '(^|/)\.codegraph/' || true)"
          if [ -n "$tracked" ]; then
            echo '::error:: .codegraph/ must never be tracked:'
            echo "$tracked"
            exit 1
          fi

  # Supply-chain gate: fail on high+ severity advisories.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # CLI is zero-dep with no lockfile; generate one in the CI workspace
      # (never committed) so npm audit can resolve the tree.
      - run: npm install --package-lock-only --no-audit --no-fund
        working-directory: packages/cli
      - run: npm audit --audit-level=high
        working-directory: packages/cli
      # The MCP server depends on the official MCP SDK + Zod.
      - run: npm audit --audit-level=high
        working-directory: packages/mcp

  # Supply-chain gate: gitleaks scans full history and fails on any secret.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
