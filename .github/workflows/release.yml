name: Release

# Tag-triggered extension release. Pushing a `vextension-*` tag runs the same
# gates as the CI extension job, builds the vsix (plain `vsce package` via
# `npm run package` — NEVER `--no-dependencies`, which would drop the
# externalized better-sqlite3 native binding), and publishes a GitHub Release
# with the vsix attached. See docs/releasing.md.
on:
  push:
    tags:
      - 'vextension-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: packages/extension
      - run: npm run typecheck
        working-directory: packages/extension
      - run: npm run compile
        working-directory: packages/extension
      - run: npm test
        working-directory: packages/extension
      - run: npm run package
        working-directory: packages/extension
      - run: ls archgen-extension-*.vsix
        working-directory: packages/extension
      - id: meta
        run: echo "version=${GITHUB_REF_NAME#vextension-}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          name: ArchGen Extension v${{ steps.meta.outputs.version }}
          body: |
            The visual layer for archgen — live task DAG, code-dependency graph, rendered docs, and a ▶ button that hands any task to your coding agent.

            **This release is part of the MCP-first archgen.** The extension used to shell out to the skill's `scripts/next-tasks.mjs`; those scripts no longer exist. All deterministic capability now lives in the **archgen MCP server** (`archgen-mcp`), and the extension calls that same server — one implementation, three ways in (the agent over MCP, the installer over `archgen-mcp bootstrap`, the extension over `archgen-mcp exec`).

            **Install:** download `archgen-extension-${{ steps.meta.outputs.version }}.vsix` below, then run *Extensions: Install from VSIX…* in VS Code (Cursor, Windsurf, and VSCodium work too).

            **Privacy:** the extension never edits your plan, your tasks, or your code. It writes only its own runtime state under `.archgen/.runtime/` (a heartbeat and the command acknowledgements the archgen MCP server uses to drive the board). No telemetry, no LLM calls.

            **The rest of archgen:** `npx archgen-skill init` installs the skill and wires the `archgen-mcp` MCP server into every detected harness — see the [repo README](https://github.com/akashmaurya99/archgen).
          files: packages/extension/*.vsix
          fail_on_unmatched_files: true
          generate_release_notes: true
