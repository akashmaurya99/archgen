name: Publish to npm

# Tag-triggered npm publishing for the two npm packages:
#
#   vmcp-<version>  ->  archgen-mcp    (the MCP server)
#   vcli-<version>  ->  archgen-skill  (the CLI + the skill)
#
# TWO AUTHENTICATION PATHS, IN ORDER — npm tries OIDC first and falls back to
# the token only if the OIDC exchange is refused:
#
#   1. OIDC TRUSTED PUBLISHING (preferred, no secret at all).
#      npm exchanges the GitHub Actions OIDC token for a short-lived publish
#      credential. There is no long-lived credential in this repository to
#      store, rotate, or leak.
#      Requires, ONCE PER PACKAGE, on npmjs.com:
#        Package -> Settings -> Trusted Publishers -> GitHub Actions
#          organization/user : the npm account that owns the package
#          repository       : akashmaurya99/archgen
#          workflow filename: publish-npm.yml
#          environment      : (leave empty)
#      And npm CLI >= 11.5.1 (this workflow installs Node 24, which ships it).
#
#   2. NPM_TOKEN (fallback only).
#      A classic npm automation token, stored as the GitHub secret NPM_TOKEN.
#      It is tried ONLY after the OIDC publish has failed — because npm uses
#      trusted publishing only when NO auth token is present: a
#      NODE_AUTH_TOKEN in the environment makes npm prefer the token and
#      IGNORE the trusted publisher.
#      A token with 2FA enabled CANNOT publish from CI at all: npm answers
#      `EOTP — This operation requires a one-time password`. A CI token that
#      can publish must therefore be one created to BYPASS 2FA.
#      This path is also the only way to publish a package the FIRST time,
#      because a package that does not exist yet has no "Trusted Publishers"
#      page.
#
# PUBLISH ORDER: archgen-mcp FIRST. `archgen-skill init` resolves the MCP
# server from the registry, so advertising a server that does not exist yet
# hands every user a broken bootstrap. The vcli tag can therefore be pushed
# only after the vmcp tag's publish has succeeded.

on:
  push:
    tags:
      - 'vmcp-*'
      - 'vcli-*'

permissions:
  contents: read
  id-token: write # OIDC: this is the entire credential for path 1

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: vmcp
            dir: packages/mcp
            name: archgen-mcp
            has_lockfile: true
          - tag: vcli
            dir: packages/cli
            name: archgen-skill
            # The CLI is zero-dependency and ships no lockfile on purpose.
            has_lockfile: false
    # Each matrix leg handles ONE tag prefix. Without this guard, pushing an
    # `vmcp-` tag also ran the archgen-skill leg, which then refused the
    # mismatched tag and turned the whole run red for a reason that was not a
    # real problem.
    steps:
      - uses: actions/checkout@v4
        if: startsWith(github.ref_name, matrix.tag)

      - uses: actions/setup-node@v4
        if: startsWith(github.ref_name, matrix.tag)
        with:
          # Node 24 ships npm 11.x. npm's trusted publishing needs npm CLI
          # >= 11.5.1, and Node 22 still ships npm 10.x — so the publish job
          # runs on 24 on purpose. The check below makes the requirement
          # explicit instead of leaving it to whichever patch release CI
          # happens to install.
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # The tag must name the package's CURRENT version. A tag left over from
      # an older commit would otherwise publish that older version again (or a
      # duplicate), and npm refuses re-publishes — so fail early and loudly.
      - name: Verify the tag matches the package version
        id: verify
        if: startsWith(github.ref_name, matrix.tag)
        working-directory: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          pkg="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          expected="${GITHUB_REF_NAME#${{ matrix.tag }}-}"
          echo "package=$pkg version=$version tag=$GITHUB_REF_NAME expected=$expected"
          if [ "$version" != "$expected" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match $pkg version $version"
            exit 1
          fi
          echo "publishing=$pkg@$version" >> "$GITHUB_OUTPUT"

      # Fail HERE — with an actionable message — rather than at the publish
      # step with a bare 401. Two ways to be ready:
      #   * npm trusted publishing configured for this package (no secret), or
      #   * the NPM_TOKEN secret set in this repository.
      #
      # Plain shell, on purpose: an inline `node -e` script is a quoting
      # hazard (a top-level `return` in it is a SyntaxError — which is
      # exactly how this check silently failed the first time).
      - name: Check that a publish credential is available
        if: startsWith(github.ref_name, matrix.tag)
        run: |
          version="$(npm --version)"
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          patch="${patch%%-*}"

          # npm's trusted publishing needs npm CLI >= 11.5.1.
          oidc_ok=0
          if [ "$major" -gt 11 ]; then
            oidc_ok=1
          elif [ "$major" -eq 11 ]; then
            if [ "$minor" -gt 5 ]; then
              oidc_ok=1
            elif [ "$minor" -eq 5 ] && [ "$patch" -ge 1 ]; then
              oidc_ok=1
            fi
          fi

          if [ "$oidc_ok" -eq 1 ]; then
            # npm's version is NECESSARY but not SUFFICIENT: the exchange
            # only succeeds if the package has a TRUSTED PUBLISHER configured
            # on npmjs.com. This step cannot prove that — the exchange
            # happens inside `npm publish` — so it says so plainly instead of
            # implying the credential is ready. The publish step reports the
            # real answer.
            echo "npm CLI $version supports trusted publishing (OIDC)."
            if [ -n "${NPM_TOKEN:-}" ]; then
              # The fallback is NOT equivalent. npm now restricts classic
              # tokens that bypass 2FA: a token published from CI without a
              # one-time password fails with `EOTP — This operation requires
              # a one-time password`. A token that cannot publish directly
              # is therefore not a fallback at all — it is a second way to
              # fail. Say that HERE, where the remedy can be named.
              echo "::warning::the NPM_TOKEN secret is present — it is tried ONLY if the OIDC publish fails."
              echo "::warning::A classic token with 2FA enabled CANNOT publish from CI: npm answers EOTP (one-time password required). The token fallback only works for a token created to bypass 2FA."
              echo "::notice::the real fix is the TRUSTED PUBLISHER for $PACKAGE_NAME on npmjs.com (Settings -> Trusted Publishers -> GitHub Actions, repository akashmaurya99/archgen, workflow publish-npm.yml)."
            else
              echo "::notice::publishing via OIDC — it requires a TRUSTED PUBLISHER on npmjs.com for $PACKAGE_NAME (Settings -> Trusted Publishers -> GitHub Actions, repository akashmaurya99/archgen, workflow publish-npm.yml)."
            fi
          elif [ -n "${NPM_TOKEN:-}" ]; then
            echo "::warning::npm CLI $version cannot do trusted publishing (needs >= 11.5.1); publishing with the NPM_TOKEN secret instead."
            # A token that is present but wrong (revoked, wrong scope, wrong
            # registry) would otherwise fail at the publish step with a bare
            # 401. Prove it HERE, where the message can name the cause.
            if ! npm whoami --registry=https://registry.npmjs.org >/dev/null 2>&1; then
              echo "::error::The NPM_TOKEN secret is present but npm cannot authenticate with it."
              echo "::error::Fix: check the token is not revoked, is an automation token, and is scoped to $PACKAGE_NAME."
              exit 1
            fi
            echo "the NPM_TOKEN secret authenticates against the registry."
          else
            echo "::error::No publish credential. npm CLI $version cannot do trusted publishing (needs >= 11.5.1) and the NPM_TOKEN secret is not set."
            echo "::error::Fix: add the NPM_TOKEN secret to this repository, OR configure npm trusted publishing for $PACKAGE_NAME on npmjs.com (Package -> Settings -> Trusted Publishers -> GitHub Actions, repository akashmaurya99/archgen, workflow publish-npm.yml)."
            exit 1
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: ${{ matrix.name }}

      # The CLI's installer resolves `archgen-mcp` from the registry, so
      # publishing the CLI before the server would hand every user a broken
      # bootstrap. This makes that ordering a RULE, not a habit — and it is
      # checked against the REGISTRY, not against this repository, because
      # what matters is what a user's `npm install` will find.
      - name: Verify the MCP server is already on the registry
        if: startsWith(github.ref_name, 'vcli')
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#vcli-}"
          for attempt in 1 2 3 4 5 6; do
            status="$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/archgen-mcp/$version")"
            if [ "$status" = "200" ]; then
              echo "archgen-mcp@$version is on the registry."
              exit 0
            fi
            echo "attempt $attempt: archgen-mcp@$version -> HTTP $status"
            sleep 10
          done
          echo "::error::archgen-mcp@$version is not on the registry yet (HTTP $status)."
          echo "::error::Publish the MCP server FIRST: push the vmcp-$version tag and let that workflow finish, then re-run this job."
          exit 1

      - name: Install
        if: startsWith(github.ref_name, matrix.tag)
        working-directory: ${{ matrix.dir }}
        run: |
          if [ "${{ matrix.has_lockfile }}" = "true" ]; then
            npm ci --no-audit --no-fund
          else
            # packages/cli is ZERO-DEPENDENCY and deliberately ships NO
            # lockfile: there is nothing to install, and `npm ci` REFUSES a
            # missing lockfile (EUSAGE: "can only install with an existing
            # package-lock.json"). A lockfile is generated only so npm can
            # resolve the (empty) tree — it is never committed.
            echo "packages/cli has no dependencies and no lockfile — nothing to install."
            npm install --package-lock-only --no-audit --no-fund
          fi

      # The CLI is zero-dependency, but its TESTS are not: the migration
      # suite drives the REAL archgen MCP server (packages/mcp/bin/
      # archgen-mcp.mjs), which needs the MCP SDK. Without the server's
      # dependencies installed, those tests fail with ERR_MODULE_NOT_FOUND
      # and the release never reaches the publish step.
      #
      # The CI workflow already installs them for the same reason (see
      # .github/workflows/ci.yml, the `cli` job). This leg did not — so every
      # publish run of the CLI leg failed at Test, and every release since
      # the CLI started delegating to the server had to be published by hand.
      - name: Install the server's dependencies for the CLI's tests
        if: startsWith(github.ref_name, matrix.tag) && matrix.has_lockfile == 'false'
        working-directory: packages/mcp
        run: npm ci --no-audit --no-fund

      - name: Test
        if: startsWith(github.ref_name, matrix.tag)
        working-directory: ${{ matrix.dir }}
        run: npm test

      # ALREADY PUBLISHED? npm refuses to overwrite a version, and the
      # refusal arrives as a bare 403 — which reads like a credential
      # problem rather than "this version is out". Say it before packing.
      - name: Verify the version is not already published
        if: startsWith(github.ref_name, matrix.tag)
        working-directory: ${{ matrix.dir }}
        run: |
          version="${GITHUB_REF_NAME#vmcp-}"
          version="${version#vcli-}"
          if npm view "${{ matrix.name }}@$version" version >/dev/null 2>&1; then
            echo "::error::${{ matrix.name }}@$version is ALREADY on the registry — npm never overwrites a published version."
            echo "::error::Nothing was published. If the manual publish was intentional, this job is simply done; if it was not, the tag is wrong."
            exit 1
          fi

      # THE OIDC PATH FIRST, AND THE TOKEN ONLY AS A FALLBACK.
      #
      # npm uses TRUSTED PUBLISHING only when NO auth token is present: a
      # NODE_AUTH_TOKEN in the environment makes npm prefer the token and
      # IGNORE the trusted publisher. The workflow used to set the token
      # whenever the secret existed, so the OIDC exchange never happened —
      # and a classic token with 2FA enabled cannot publish from CI at all
      # (`EOTP — This operation requires a one-time password`). The trusted
      # publisher was therefore unreachable, and the release failed with an
      # error that named the wrong cause.
      #
      # So: publish with NO token first (npm exchanges the workflow's OIDC
      # identity), and only if THAT fails fall back to the token.
      - name: Publish (npm trusted publishing / OIDC)
        if: startsWith(github.ref_name, matrix.tag)
        working-directory: ${{ matrix.dir }}
        id: publish_oidc
        continue-on-error: true
        run: |
          set -o pipefail
          echo "::notice::publishing via npm trusted publishing (OIDC) — no auth token is set, so npm uses the workflow identity"
          npm publish --provenance --access public 2>&1 | tee publish.log

      - name: Publish (NPM_TOKEN fallback)
        if: startsWith(github.ref_name, matrix.tag) && failure()
        working-directory: ${{ matrix.dir }}
        run: |
          set -o pipefail
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::The OIDC publish failed and no NPM_TOKEN secret is set."
            echo "::error::Fix: npmjs.com -> Packages -> ${{ matrix.name }} -> Settings -> Trusted Publishers -> GitHub Actions (repository akashmaurya99/archgen, workflow publish-npm.yml). The trusted publisher needs NO token."
            exit 1
          fi
          echo "::warning::the OIDC publish failed — retrying with the NPM_TOKEN secret."
          export NODE_AUTH_TOKEN="$NPM_TOKEN"
          npm publish --provenance --access public 2>&1 | tee publish-fallback.log || {
            echo "::error::npm publish failed for ${{ matrix.name }} on BOTH paths."
            if grep -q "EOTP" publish-fallback.log; then
              echo "::error::Cause: EOTP — npm requires a one-time password. The fallback token is 2FA-protected, so it cannot publish from CI."
              echo "::error::Fix: npmjs.com -> Packages -> ${{ matrix.name }} -> Settings -> Trusted Publishers -> GitHub Actions (repository akashmaurya99/archgen, workflow publish-npm.yml). The trusted publisher needs NO token."
            elif grep -qE "ENEEDAUTH|401|E403" publish-fallback.log; then
              echo "::error::Cause: the registry refused the credential (ENEEDAUTH/401/E403). The npm trusted publisher is not configured for this package, or the token is revoked."
              echo "::error::Fix: npmjs.com -> Packages -> ${{ matrix.name }} -> Settings -> Trusted Publishers -> GitHub Actions (repository akashmaurya99/archgen, workflow publish-npm.yml)."
            else
              echo "::error::See publish-fallback.log above for npm's own message."
            fi
            exit 1
          }
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The package name in the log proves which package went out; the npm URL
      # is the canonical landing page.
      - name: Summary
        if: startsWith(github.ref_name, matrix.tag)
        run: |
          echo "::notice::published ${{ steps.verify.outputs.publishing }} — https://www.npmjs.com/package/${{ matrix.name }}"
