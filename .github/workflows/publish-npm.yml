name: Publish to npm

# Tag-triggered npm publishing for the two npm packages:
#
#   vmcp-<version>  ->  archgen-mcp    (the MCP server)
#   vcli-<version>  ->  archgen-skill  (the CLI + the skill)
#
# TWO AUTHENTICATION PATHS, IN ORDER — npm tries OIDC first and falls back to
# the token only if the OIDC exchange is refused:
#
#   1. OIDC TRUSTED PUBLISHING (preferred, no secret at all).
#      npm exchanges the GitHub Actions OIDC token for a short-lived publish
#      credential. There is no long-lived credential in this repository to
#      store, rotate, or leak.
#      Requires, ONCE PER PACKAGE, on npmjs.com:
#        Package -> Settings -> Trusted Publishers -> GitHub Actions
#          organization/user : the npm account that owns the package
#          repository       : akashmaurya99/archgen
#          workflow filename: publish-npm.yml
#          environment      : (leave empty)
#      And npm CLI >= 11.5.1 (this workflow installs Node 24, which ships it).
#
#   2. NPM_TOKEN (fallback / first publish).
#      A classic npm automation token, stored as the GitHub secret NPM_TOKEN.
#      npm's OIDC exchange NEVER throws — when the trusted publisher is not
#      configured, npm logs it at verbose level and keeps using the token.
#      This is the ONLY way to publish archgen-mcp the first time, because a
#      package that does not exist yet has no "Trusted Publishers" page.
#
# PUBLISH ORDER: archgen-mcp FIRST. `archgen-skill init` resolves the MCP
# server from the registry, so advertising a server that does not exist yet
# hands every user a broken bootstrap. The vcli tag can therefore be pushed
# only after the vmcp tag's publish has succeeded.

on:
  push:
    tags:
      - 'vmcp-*'
      - 'vcli-*'

permissions:
  contents: read
  id-token: write # OIDC: this is the entire credential for path 1

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: vmcp
            dir: packages/mcp
            name: archgen-mcp
          - tag: vcli
            dir: packages/cli
            name: archgen-skill
    # Each matrix leg handles ONE tag prefix. Without this guard, pushing
    # `vmcp-0.0.6` also ran the archgen-skill leg, which then refused the
    # mismatched tag and turned the whole run red for a reason that was not a
    # real problem.
    steps:
      - uses: actions/checkout@v4
        if: startsWith(github.ref_name, matrix.tag)

      - uses: actions/setup-node@v4
        if: startsWith(github.ref_name, matrix.tag)
        with:
          # Node 24 ships npm 11.x. npm's trusted publishing needs npm CLI
          # >= 11.5.1, and Node 22 still ships npm 10.x — so the publish job
          # runs on 24 on purpose. The check below makes the requirement
          # explicit instead of leaving it to whichever patch release CI
          # happens to install.
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # The tag must name the package's CURRENT version. A tag left over from
      # an older commit would otherwise publish that older version again (or a
      # duplicate), and npm refuses re-publishes — so fail early and loudly.
      - name: Verify the tag matches the package version
        id: verify
        if: startsWith(github.ref_name, matrix.tag)
        working-directory: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          pkg="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          expected="${GITHUB_REF_NAME#${{ matrix.tag }}-}"
          echo "package=$pkg version=$version tag=$GITHUB_REF_NAME expected=$expected"
          if [ "$version" != "$expected" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match $pkg version $version"
            exit 1
          fi
          echo "publishing=$pkg@$version" >> "$GITHUB_OUTPUT"

      # Fail HERE — with an actionable message — rather than at the publish
      # step with a bare 401. Two ways to be ready:
      #   * npm trusted publishing configured for this package (no secret), or
      #   * the NPM_TOKEN secret set in this repository.
      - name: Check that a publish credential is available
        if: startsWith(github.ref_name, matrix.tag)
        run: |
          version="$(npm --version)"
          # NOTE: no top-level `return` — `node -e` runs in a module wrapper,
          # where a top-level return is a SyntaxError.
          node -e '
            const v = process.argv[1];
            const [maj, min, pat] = v.split(".").map(Number);
            const oidcOk = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
            const hasToken = Boolean(process.env.NPM_TOKEN);
            if (oidcOk) {
              console.log(`npm CLI ${v} supports trusted publishing (OIDC).`);
            } else if (hasToken) {
              console.log(`::warning::npm CLI ${v} cannot do trusted publishing (needs >= 11.5.1); publishing with the NPM_TOKEN secret instead.`);
            } else {
              console.error(`::error::No publish credential. npm CLI ${v} cannot do trusted publishing (needs >= 11.5.1) and the NPM_TOKEN secret is not set.`);
              console.error(`::error::Fix: add the NPM_TOKEN secret to this repository, OR configure npm trusted publishing for ${process.env.PACKAGE_NAME} on npmjs.com (Package -> Settings -> Trusted Publishers -> GitHub Actions, repository akashmaurya99/archgen, workflow publish-npm.yml).`);
              process.exit(1);
            }
          ' "$version"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: ${{ matrix.name }}

      - name: Install
        if: startsWith(github.ref_name, matrix.tag)
        working-directory: ${{ matrix.dir }}
        run: npm ci --no-audit --no-fund

      - name: Test
        if: startsWith(github.ref_name, matrix.tag)
        working-directory: ${{ matrix.dir }}
        run: npm test

      - name: Publish
        if: startsWith(github.ref_name, matrix.tag)
        working-directory: ${{ matrix.dir }}
        # npm tries OIDC first (the exchange never throws, so it falls back to
        # the token on its own). The token is put in the environment ONLY when
        # it exists: an EMPTY NODE_AUTH_TOKEN would make npm authenticate with
        # "" and fail with ENEEDAUTH instead of using OIDC.
        run: |
          set -o pipefail
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "::notice::the NPM_TOKEN secret is present; npm will use it if the OIDC exchange is refused"
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          else
            echo "::notice::no NPM_TOKEN secret — publishing via npm trusted publishing (OIDC)"
          fi
          npm publish --provenance --access public 2>&1 | tee publish.log || {
            echo "::error::npm publish failed for ${{ matrix.name }}. If this says ENEEDAUTH or 401, the npm trusted publisher is not configured for it."
            echo "::error::Fix: npmjs.com -> Packages -> ${{ matrix.name }} -> Settings -> Trusted Publishers -> GitHub Actions (repository akashmaurya99/archgen, workflow publish-npm.yml), OR add the NPM_TOKEN secret to this repository."
            exit 1
          }
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The package name in the log proves which package went out; the npm URL
      # is the canonical landing page.
      - name: Summary
        if: startsWith(github.ref_name, matrix.tag)
        run: |
          echo "::notice::published ${{ steps.verify.outputs.publishing }} — https://www.npmjs.com/package/${{ matrix.name }}"
